plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
    id 'io.github.mlangc.jmhreport'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    implementation 'com.google.guava:guava:19.0'
    implementation 'com.jakewharton.byteunits:byteunits:0.9.1'

    implementation 'org.apache.hadoop:hadoop-common:2.6.0'
    implementation 'org.apache.hadoop:hadoop-hdfs:2.6.0'

    jmh 'com.yahoo.datasketches:memory:0.8.4'
    jmh 'org.assertj:assertj-core:3.27.7'
}

jmh {
    resultFormat = 'JSON'
    zip64 = true
    includes = ['.*Quick.*']
}

jmhReport {
    jmhResultPath = 'build/results/jmh/results.json'
}

tasks.jmh.finalizedBy tasks.jmhReport
